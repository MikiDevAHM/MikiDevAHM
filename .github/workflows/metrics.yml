# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Rodar 1x/dia em vez de 1x/hora: as estatísticas de linguagem/atividade
  # não mudam o suficiente hora a hora pra justificar 24 execuções/dia.
  # Ajuste o horário (UTC) como preferir.
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:

# Se alguém disparar o workflow de novo antes do anterior terminar,
# cancela o anterior em vez de rodar os dois em paralelo.
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: MikiDevAHM
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Vienna

          # --- Languages (algoritmo padrão, rápido: sem clone) ---
          # OBS: sem plugin_languages_indepth: yes, as opções abaixo NÃO
          # tinham efeito nenhum no seu workflow original, mesmo estando
          # configuradas: plugin_languages_analysis_timeout(_repositories),
          # plugin_languages_categories, plugin_languages_recent_*.
          # Elas só existem no modo indepth (que clona os repos e é bem
          # mais lento). O ranking "de verdade" (bytes + nº de repos +
          # bônus de uso recente, incluindo repos de org/contribuição)
          # agora é calculado pelo job "language-stats" abaixo, sem clonar
          # nada. Aqui deixamos só uma visão rápida e nativa como bônus.
          plugin_languages: yes
          plugin_languages_limit: 8   # 8 é o máximo permitido pelo plugin
          plugin_languages_threshold: 0%
          plugin_languages_colors: github

          # --- Lines (já era leve, mantido) ---
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

  language-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calcular ranking ponderado de linguagens
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_LOGIN: MikiDevAHM
          RECENT_DAYS: "15"
          MIN_LANGUAGES: "5"
          MAX_LANGUAGES: "8"
          # Pesos ajustáveis: quanto cada critério pesa no score final
          WEIGHT_BYTES: "0.5"   # volume de código (proxy de LOC), escala log
          WEIGHT_REPOS: "0.3"   # em quantos repositórios distintos aparece
          RECENT_BONUS: "0.3"   # bônus fixo se usada nos últimos RECENT_DAYS
        run: node scripts/language-stats.mjs

      - name: Commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add language-stats.svg language-stats.json
          git diff --staged --quiet || git commit -m "chore: update language stats"
          git push
