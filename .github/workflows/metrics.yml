# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Run once a day instead of every hour: activity/language stats don't
  # change enough hour to hour to justify 24 runs/day. Adjust the time
  # (UTC) if you want.
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:

# Cancel a previous in-progress run if a new one is triggered.
concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}

          user: MikiDevAHM
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Vienna

          # plugin_languages is disabled here on purpose: the weighted
          # ranking (bytes + repo count + recent-use bonus, including
          # org/contributed repos) is now computed by the "language-stats"
          # job below and rendered as its own SVG, styled to match this
          # card. Keeping the native plugin too would just show two
          # different, conflicting rankings.

          # --- Lines (already lightweight, kept as is) ---
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

  language-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that the token is set
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.GH_TOKEN came back empty in this job."
            echo "::error::Check Settings > Secrets and variables > Actions:"
            echo "::error::1) the secret is named exactly GH_TOKEN"
            echo "::error::2) it's under 'Repository secrets', not inside an Environment"
            echo "::error::   (if it's an Environment secret, add 'environment: <name>' to this job)"
            exit 1
          fi

      - name: Compute weighted language ranking
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_LOGIN: MikiDevAHM
          RECENT_DAYS: "15"
          MIN_LANGUAGES: "5"
          MAX_LANGUAGES: "8"
          # Adjustable weights for the final score
          WEIGHT_BYTES: "0.5"   # code volume (LOC proxy), log-scaled
          WEIGHT_REPOS: "0.3"   # how many distinct repos use it
          RECENT_BONUS: "0.3"   # flat bonus if used in the last RECENT_DAYS
          CARD_WIDTH: "480"     # match github-metrics.svg width so the cards line up
        run: node scripts/language-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add language-stats.svg language-stats.json
          git diff --staged --quiet || git commit -m "chore: update language stats"
          git push
